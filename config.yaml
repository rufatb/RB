# ─────────────────────────────────────────────────────────────────────────────
# Pre-Open Brief — configuration
#
# Everything that tunes behaviour lives here so the code stays declarative.
# The defaults target AC.TO (Air Canada, TSX). Override per your account.
# ─────────────────────────────────────────────────────────────────────────────

ticker: AC.TO
exchange_tz: America/Toronto
market_open: "09:30"     # exchange local time
market_close: "16:00"

# Correlated context set. These are CONTEXT, never standalone signals.
# Crude is listed first deliberately — it is the dominant fuel-cost lever
# for an airline and is surfaced prominently in the brief.
correlated:
  crude: "CL=F"          # WTI front-month
  tsx: "^GSPTSE"         # S&P/TSX Composite
  cadusd: "CADUSD=X"     # CAD per USD
  vix: "^VIX"            # volatility
  airline_peers: ["UAL", "DAL", "AAL", "LUV"]

# Risk inputs. Position size is derived from THESE plus stop distance —
# never from conviction. See risk.py for the reasoning.
risk:
  account_equity: 100000     # account base currency
  risk_per_trade_pct: 0.5    # % of equity risked per trade
  max_position_pct: 50       # cap position VALUE at this % of equity — a tight
                             # stop must not balloon size (seen live: $102k
                             # position on $100k equity from a $0.12 stop)
  is_margin: true            # is the hypothetical position on margin?
  cad_prime: 4.45            # broker CAD prime rate (%)
  margin_spread: 3.25        # broker spread over prime (%)

# Data-integrity guard thresholds.
guard:
  max_stale_minutes: 20      # last-trade age that fails freshness in-session
  source_conflict_pct: 2.0   # cross-source price divergence that flags conflict

# Structure / level detection.
levels:
  swing_lookback_days: 60    # window for auto swing-low/high detection
  daily_lookback_days: 400   # for 52w high/low + indicators
  orb_minutes: 5             # opening-range window (also computes 1-min ORB)
  spike_fade_window_min: 15  # K minutes used to locate the opening drive extreme

# Data sources (multi-source). `primary` serves all metrics; each entry in
# `cross_check` is pulled independently so the integrity guard can flag a SOURCE
# CONFLICT. Key-based sources (finnhub, twelvedata) activate only when their API
# key env var is set and are skipped silently otherwise — never fabricated.
#   primary options:    yahoo_direct (default, free, reliable) | yahoo_yf |
#                       stooq | finnhub | twelvedata | manual
#   cross_check:        any of the above (missing-key sources are skipped)
data_sources:
  primary: yahoo_direct
  cross_check: [stooq]          # add finnhub / twelvedata once keys are set
  # API keys are read from env vars, never stored here:
  #   FINNHUB_API_KEY, TWELVEDATA_API_KEY

# Deep historical pattern mining (patterns.py). Uses as much history as the
# source returns; every stat carries its sample size.
patterns:
  enabled: true

# Claude analysis layer (analyst.py). Advisory CONTEXT only — it can never
# override the capped probability/verdict. Requires ANTHROPIC_API_KEY in env.
claude:
  enabled: true                 # also needs the --analyst flag or default-on
  model: claude-opus-4-8
  max_tokens: 1500

# TSX opportunity scanner (scan.py). Ranks a universe by how confident an
# open-to-close call can be (within the [0.35,0.65] cap), long or short, so you
# can tell whether the anchor ticker is the best use of risk today.
scan:
  workers: 8
  top_n: 3                        # how many longs/shorts the at-open scan surfaces
  # A name is only "actionable" once it has held the SAME verdict for this many
  # consecutive scans AND its lenses aren't conflicted. Added after a day of
  # losses from chasing the 5-min rotating leader (see STRATEGY.md).
  # NOTE: the primary strategy is now the once-at-open scan (`scan.py --open`),
  # which uses cross-lens AGREEMENT instead of time-persistence. min_persistence
  # only applies to the legacy 5-min loop mode.
  min_persistence: 2
  # UNIVERSE IS DELIBERATELY COMPACT (day-14, validate_universe.py): a 61-name
  # TSX-60-style expansion was tested and REJECTED — densest pair legs fell to
  # 40-50% with negative capture because low-volatility names (EMA/BCE/T/L/H)
  # hijack the density selection; per-name normalization fixed nothing and
  # broke the year-long validated result. Do NOT widen this list unless the
  # expansion passes the deep four-quarter protocol in validate_deep.py.
  universe:                       # liquid TSX names; anchor ticker auto-added
    - AC.TO
    - RY.TO
    - TD.TO
    - BNS.TO
    - BMO.TO
    - CM.TO
    - ENB.TO
    - TRP.TO
    - CNQ.TO
    - SU.TO
    - CVE.TO
    - CP.TO
    - CNR.TO
    - SHOP.TO
    - ABX.TO
    - AEM.TO
    - NTR.TO
    - MFC.TO
    - SLF.TO
    - BCE.TO
    - T.TO

# Sentiment lens (sentiment.py). Enabled as a WEAK confirming lens — the
# relevance gate keeps it honest: only headlines that actually mention the
# company are scored; when the free feed returns generic news (common), the
# lens reports `unavailable` and contributes NOTHING rather than noise.
sentiment:
  enabled: true

# Presentation bar (report.py). A pick is PRINTED only if its sided calibrated
# probability clears this AND it has a confirming lens (tier Medium). Below the
# bar -> "NO QUALIFIED LONG/SHORT" (day-3 midday + day-5 morning lesson: a
# printed 0.52 coin flip is a recommendation no matter the caveats).
report:
  min_sided_p: 0.55

# Probability clamps. HARD limits on intraday open-to-close direction.
# These are guardrails against confidence inflation and are asserted in code.
# Config can only NARROW the band — the hard [0.35, 0.65] limits are enforced
# in code regardless of what is written here (see README).
probability:
  floor: 0.35
  cap: 0.65       # an intraday open-to-close call may NEVER exceed this
  default: 0.50   # the honest baseline: it's near a coin flip
  # Calibration shrinkage applied when mapping the analog base rate to the
  # stated EOD probability: p = 0.5 + shrinkage*(green% - 50%). The backtest
  # measured raw analog probabilities as OVERCONFIDENT (Brier 0.257 vs the
  # 0.25 say-nothing baseline), so the stated number is compressed toward 0.5.
  # 1.0 = no compression; may only compress, never amplify (asserted in code).
  shrinkage: 0.5
  # Out-of-sample finding (AC/SHOP/CNQ/RY backtests, ~2,400 days each):
  # bearish base rates systematically overstate the edge (predicted 0.42
  # realized ~0.50). Short leans get extra compression — may only compress
  # MORE than `shrinkage`, never less (enforced in code).
  short_shrinkage: 0.35

# Analog-day engine tunables (patterns.analog_days + scan gates). No hardcoding:
# these were previously fixed constants in code.
analogs:
  k: 25                 # nearest neighbours per setup
  smoothing_m: 10       # Beta-prior pseudo-observations shrinking green% to 50
  long_threshold: 55    # smoothed green% needed to call an EOD long lean
  short_threshold: 45   # smoothed green% at/below which an EOD short lean

# Sector→crude macro lens (scan.macro_dir_for). Crude up helps beneficiaries
# (producers/pipelines) and hurts victims (fuel consumers, e.g. airlines).
sectors:
  crude_beneficiaries: [CNQ.TO, SU.TO, CVE.TO, ENB.TO, TRP.TO, IMO.TO]
  crude_victims: [AC.TO]

# Peer groups (r945 peer-contradiction gate). A qualified pick whose direction
# opposes >= peer_contradiction_min qualified picks in its own group is
# EXCLUDED — a lone bank short against a bid banking sector is usually a
# mechanical/idiosyncratic gap followed by laggard catch-up (the TD day-8
# loss: 6 financials long, TD short 0.55, TD closed +1.22% — top riser).
peer_groups:
  financials: [RY.TO, TD.TO, BMO.TO, BNS.TO, CM.TO, MFC.TO, SLF.TO]
  energy: [CNQ.TO, SU.TO, CVE.TO, ENB.TO, TRP.TO]
  gold: [ABX.TO, AEM.TO]
  telecom: [BCE.TO, T.TO]
  rail: [CP.TO, CNR.TO]
peer_contradiction_min: 3

# THE PAIR (r945.pair_of_day) — the one long + one short actually traded under
# the once-daily workflow. Each leg is the DENSEST qualified pick (smallest
# k-NN neighbour distance). Day-12 honesty: the day-9 evidence for densest
# (68%/69% on all splits, "p~0.0007") did NOT survive a 3-session window
# roll (52.7%, z=0.21) — densest is a deterministic TIE-BREAK among
# equivalent ~52-56% leans, not a validated edge. It stays because the daily
# pair needs one reproducible rule and its live ledger record (role=pair)
# accrues either way. Only known selectors are accepted: densest | max_p.
pair:
  selector: densest
  crowded_conf_warn: 3    # warn when >= this many same-group picks agree with
                          # a leg — crowded direction hit 44%/33% in validation
                          # (warning only, not a gate, until live data decides)
  stale_after_min: 20     # a run this many minutes past 9:46 prints the LATE
                          # RUN banner with per-leg drift — the validation
                          # enters AT the 9:45 print (day-11 lesson)
  spent_drift_pct: 0.3    # drift in the call's direction beyond this = leg
                          # flagged "edge partly SPENT — do not chase"
  max_chase_pct: 0.15     # worst acceptable fill vs the printed price; a fill
                          # past the bound = NO TRADE (day-11 close: a winning
                          # CP short captured 0 because the fill chased -0.34%)
  disaster_stop_pct: 2.5  # printed per-leg disaster line (day-16 year-test:
                          # exiting beyond -2.5% was EV-neutral all four
                          # quarters and cut the worst leg -3.9% -> -2.6%;
                          # tighter stops failed). OPTIONAL circuit-breaker —
                          # hold-to-close remains the validated default.

# Midday from-here selection gates (midday.py). A side qualifies on the
# from-here conditional alone only past the strong threshold; inside the soft
# band it must be BACKED by the day-shape analog; a contradicting day-shape
# disqualifies (the MFC lesson: a 53% conflicted "best short" is NOT a pick).
midday:
  strong_long: 55
  strong_short: 45
  soft_long: 52
  soft_short: 48
  backed_long: 65
  backed_short: 35
