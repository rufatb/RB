# ─────────────────────────────────────────────────────────────────────────────
# Pre-Open Brief — configuration
#
# Everything that tunes behaviour lives here so the code stays declarative.
# The defaults target AC.TO (Air Canada, TSX). Override per your account.
# ─────────────────────────────────────────────────────────────────────────────

ticker: AC.TO
exchange_tz: America/Toronto
market_open: "09:30"     # exchange local time
market_close: "16:00"

# Correlated context set. These are CONTEXT, never standalone signals.
# Crude is listed first deliberately — it is the dominant fuel-cost lever
# for an airline and is surfaced prominently in the brief.
correlated:
  crude: "CL=F"          # WTI front-month
  tsx: "^GSPTSE"         # S&P/TSX Composite
  cadusd: "CADUSD=X"     # CAD per USD
  vix: "^VIX"            # volatility
  airline_peers: ["UAL", "DAL", "AAL", "LUV"]

# Risk inputs. Position size is derived from THESE plus stop distance —
# never from conviction. See risk.py for the reasoning.
risk:
  account_equity: 100000     # account base currency
  risk_per_trade_pct: 0.5    # % of equity risked per trade
  is_margin: true            # is the hypothetical position on margin?
  cad_prime: 4.45            # broker CAD prime rate (%)
  margin_spread: 3.25        # broker spread over prime (%)

# Data-integrity guard thresholds.
guard:
  max_stale_minutes: 20      # last-trade age that fails freshness in-session
  source_conflict_pct: 2.0   # cross-source price divergence that flags conflict

# Structure / level detection.
levels:
  swing_lookback_days: 60    # window for auto swing-low/high detection
  daily_lookback_days: 400   # for 52w high/low + indicators
  orb_minutes: 5             # opening-range window (also computes 1-min ORB)
  spike_fade_window_min: 15  # K minutes used to locate the opening drive extreme

# Data sources (multi-source). `primary` serves all metrics; each entry in
# `cross_check` is pulled independently so the integrity guard can flag a SOURCE
# CONFLICT. Key-based sources (finnhub, twelvedata) activate only when their API
# key env var is set and are skipped silently otherwise — never fabricated.
#   primary options:    yahoo_direct (default, free, reliable) | yahoo_yf |
#                       stooq | finnhub | twelvedata | manual
#   cross_check:        any of the above (missing-key sources are skipped)
data_sources:
  primary: yahoo_direct
  cross_check: [stooq]          # add finnhub / twelvedata once keys are set
  # API keys are read from env vars, never stored here:
  #   FINNHUB_API_KEY, TWELVEDATA_API_KEY

# Deep historical pattern mining (patterns.py). Uses as much history as the
# source returns; every stat carries its sample size.
patterns:
  enabled: true

# Claude analysis layer (analyst.py). Advisory CONTEXT only — it can never
# override the capped probability/verdict. Requires ANTHROPIC_API_KEY in env.
claude:
  enabled: true                 # also needs the --analyst flag or default-on
  model: claude-opus-4-8
  max_tokens: 1500

# TSX opportunity scanner (scan.py). Ranks a universe by how confident an
# open-to-close call can be (within the [0.35,0.65] cap), long or short, so you
# can tell whether the anchor ticker is the best use of risk today.
scan:
  workers: 8
  # A name is only "actionable" once it has held the SAME verdict for this many
  # consecutive scans AND its lenses aren't conflicted. Added after a day of
  # losses from chasing the 5-min rotating leader (see STRATEGY.md).
  min_persistence: 2
  universe:                       # liquid TSX names; anchor ticker auto-added
    - AC.TO
    - RY.TO
    - TD.TO
    - BNS.TO
    - BMO.TO
    - CM.TO
    - ENB.TO
    - TRP.TO
    - CNQ.TO
    - SU.TO
    - CVE.TO
    - CP.TO
    - CNR.TO
    - SHOP.TO
    - ABX.TO
    - AEM.TO
    - NTR.TO
    - MFC.TO
    - SLF.TO
    - BCE.TO
    - T.TO

# Probability clamps. HARD limits on intraday open-to-close direction.
# These are guardrails against confidence inflation and are asserted in code.
# Do NOT widen these without understanding why they exist (see README).
probability:
  floor: 0.35
  cap: 0.65       # an intraday open-to-close call may NEVER exceed this
  default: 0.50   # the honest baseline: it's near a coin flip
